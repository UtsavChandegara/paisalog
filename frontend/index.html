<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PaisaLog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="date-heading">Loading date...</h1>

    <div class="dashboard-grid">
        <div class="dashboard-card">
            <h3>Today's Balance</h3>
            <p>Cash: <span id="balance-cash-opening">...</span> / <span id="balance-cash-closing">...</span></p>
            <p>Online: <span id="balance-online-opening">...</span> / <span id="balance-online-closing">...</span></p>
        </div>
        <div class="dashboard-card">
            <h3>Today's Spent</h3>
            <p class="large-text" id="total-spent">...</p>
        </div>
        <div class="dashboard-card">
            <h3>Unsettled Social</h3>
            <p class="large-text" id="unsettled-count">...</p>
        </div>
    </div>

    <h2>Quick Links</h2>
    <div class="quick-links-grid">
        <a href="log.html" class="quick-link-card">
            <span class="nav-icon">➕</span>
            <span>Add Entry</span>
        </a>
        <a href="transactions.html" class="quick-link-card">
            <span class="nav-icon">💸</span>
            <span>View Txs</span>
        </a>
        <a href="social.html" class="quick-link-card">
            <span class="nav-icon">👥</span>
            <span>Social</span>
        </a>
        <a href="reports.html" class="quick-link-card">
            <span class="nav-icon">📊</span>
            <span>Reports</span>
        </a>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // API_BASE_URL is available globally from app.js

            const getTodayString = () => new Date().toISOString().split('T')[0];

            function displayTodaysDate() {
                const heading = document.getElementById('date-heading');
                const today = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                heading.textContent = today.toLocaleDateString('en-US', options);
            }

            async function fetchDashboardData() {
                const today = getTodayString();
                const loadingText = '...';
                const errorText = 'Error';

                // Get elements
                const balanceCashOpenEl = document.getElementById('balance-cash-opening');
                const balanceCashCloseEl = document.getElementById('balance-cash-closing');
                const balanceOnlineOpenEl = document.getElementById('balance-online-opening');
                const balanceOnlineCloseEl = document.getElementById('balance-online-closing');
                const totalSpentEl = document.getElementById('total-spent');
                const unsettledCountEl = document.getElementById('unsettled-count');

                // Set initial loading states
                balanceCashOpenEl.textContent = loadingText;
                balanceCashCloseEl.textContent = loadingText;
                balanceOnlineOpenEl.textContent = loadingText;
                balanceOnlineCloseEl.textContent = loadingText;
                totalSpentEl.textContent = loadingText;
                unsettledCountEl.textContent = loadingText;

                try {
                    const [balanceRes, transactionsRes, socialRes] = await Promise.all([
                        fetch(`${API_BASE_URL}/daily-balance`),
                        fetch(`${API_BASE_URL}/transactions`),
                        fetch(`${API_BASE_URL}/social-ledger`)
                    ]);

                    if (!balanceRes.ok || !transactionsRes.ok || !socialRes.ok) {
                        throw new Error('Failed to fetch dashboard data');
                    }

                    const balances = await balanceRes.json();
                    const transactions = await transactionsRes.json();
                    const socialLedger = await socialRes.json();

                    // 1. Process Daily Balance
                    const todaysBalance = balances.find(b => b.date === today);
                    balanceCashOpenEl.textContent = todaysBalance?.cash_opening?.toFixed(2) ?? 'N/A';
                    balanceCashCloseEl.textContent = todaysBalance?.cash_closing?.toFixed(2) ?? 'N/A';
                    balanceOnlineOpenEl.textContent = todaysBalance?.online_opening?.toFixed(2) ?? 'N/A';
                    balanceOnlineCloseEl.textContent = todaysBalance?.online_closing?.toFixed(2) ?? 'N/A';

                    // 2. Process Total Spent
                    const todaysDebits = transactions
                        .filter(tx => tx.date === today && tx.type === 'debit')
                        .reduce((sum, tx) => sum + tx.amount, 0);
                    totalSpentEl.textContent = `₹${todaysDebits.toFixed(2)}`;

                    // 3. Process Social Activity
                    const unsettledCount = socialLedger.filter(entry => !entry.is_settled).length;
                    unsettledCountEl.textContent = unsettledCount;

                } catch (error) {
                    console.error('Error loading dashboard:', error);
                    balanceCashOpenEl.textContent = errorText;
                    balanceCashCloseEl.textContent = '';
                    balanceOnlineOpenEl.textContent = '';
                    balanceOnlineCloseEl.textContent = '';
                    totalSpentEl.textContent = errorText;
                    unsettledCountEl.textContent = errorText;
                }
            }

            displayTodaysDate();
            fetchDashboardData();
        });
    </script>
</body>
</html>
